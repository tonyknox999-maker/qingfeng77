<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A2118"/>
      <stop offset="1" stop-color="#1A140D"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2B25E"/>
      <stop offset="1" stop-color="#E85C3C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#FFB25E" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFB25E" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="800" fill="url(#bg)"/>
  <rect width="600" height="800" fill="url(#glow)"/>
  <!-- 细金内框 -->
  <rect x="26" y="26" width="548" height="748" fill="none" stroke="url(#gold)" stroke-width="1.2" opacity="0.55"/>
  <rect x="36" y="36" width="528" height="728" fill="none" stroke="#F2B25E" stroke-width="0.5" opacity="0.25"/>
  <!-- 折纸鹤（细线稿） -->
  <g fill="none" stroke="url(#gold)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" opacity="0.9" transform="translate(300 360)">
    <path d="M0 -130 L96 -22 L150 -60 L118 10 L44 44 Z"/>
    <path d="M0 -130 L-96 -22 L-150 -60 L-118 10 L-44 44 Z" opacity="0.7"/>
    <path d="M0 -130 L44 44 L0 128 L-44 44 Z"/>
    <path d="M0 128 L28 172 L52 132" />
    <path d="M44 44 L150 96 L118 10" opacity="0.5"/>
  </g>
  <!-- 粒子点彩 -->
  <g fill="#F2B25E">
    <circle cx="150" cy="210" r="2.4" opacity="0.7"/>
    <circle cx="452" cy="188" r="2" opacity="0.5"/>
    <circle cx="120" cy="520" r="2.2" opacity="0.55"/>
    <circle cx="478" cy="560" r="2.6" opacity="0.65"/>
    <circle cx="300" cy="620" r="1.8" opacity="0.4"/>
    <circle cx="210" cy="640" r="1.6" opacity="0.35"/>
    <circle cx="398" cy="655" r="2" opacity="0.45"/>
  </g>
  <!-- 提示文字 -->
  <text x="300" y="706" text-anchor="middle" font-family="Songti SC, STSong, serif" font-size="26" fill="#C8A468" letter-spacing="10">照 片 位</text>
  <text x="300" y="742" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#8A7355" letter-spacing="2">用你的照片覆盖 images/portrait.jpg</text>
</svg>
