<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#201A2E"/>
      <stop offset="1" stop-color="#12101C"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#9B8CFF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#9B8CFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <rect width="640" height="400" fill="url(#halo)"/>
  <!-- 两枚交叠的圆：镜中世界 -->
  <g fill="none" stroke-width="2.4">
    <circle cx="285" cy="185" r="86" stroke="#B9A9FF" opacity="0.85"/>
    <circle cx="355" cy="185" r="86" stroke="#F2B25E" opacity="0.85"/>
  </g>
  <path d="M320 118 L320 252" stroke="#F6EFE1" stroke-width="1.4" opacity="0.5" stroke-dasharray="3 6"/>
  <text x="320" y="176" text-anchor="middle" font-family="Songti SC, STSong, serif" font-size="30" fill="#F6EFE1" opacity="0.9">忒修斯</text>
  <text x="320" y="204" text-anchor="middle" font-family="Songti SC, STSong, serif" font-size="30" fill="#F6EFE1" opacity="0.9">之船</text>
  <text x="320" y="330" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#8F86B8" letter-spacing="2">一个关于「我是谁」的网页小游戏</text>
  <g fill="#B9A9FF">
    <circle cx="140" cy="90" r="2.2" opacity="0.6"/>
    <circle cx="520" cy="80" r="2" opacity="0.5"/>
    <circle cx="160" cy="330" r="2" opacity="0.45"/>
    <circle cx="500" cy="345" r="2.3" opacity="0.5"/>
  </g>
</svg>
